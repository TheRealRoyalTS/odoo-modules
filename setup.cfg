[flake8]
exclude = vendored,__init__.py,__manifest__.py,thirdparty/*
max-line-length = 120
extend-ignore = E203

[pycodestyle]
max-line-length = 120
statistics = True

[coverage:run]
omit = */tests/*,*__init__.py,*__manifest__.py,vendored/*,/vendored/*,thirdparty/*

[tool:pytest]
addopts = --ignore-glob=vendored -s --odoo-config=odoo.conf --odoo-disable-docker-env

[pylint.MASTER]
ignore=vendored,__init__.py,__manifest__.py,thirdparty
ignore-patterns=\.yml,test_*
load-plugins=pylint_odoo


[pylint.MESSAGES CONTROL]
disable=C0114,C8101,C8106,E0401,R0801,R0903,W0611,W8113,W8110,C0209,no-member,protected-access,unused-argument,too-many-locals,abstract-method


[pylint.REPORTS]
score=yes


[pylint.FORMAT]
max-line-length=120


[pylint.IMPORTS]
known-third-party=enchant,odoo

[tool.hitchhiker]
project_version = 0.0.1
version_cfg = setup.cfg:tool.hitchhiker:project_version
prepend_branch_to_tag = true
