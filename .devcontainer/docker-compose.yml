# version: '3.8'

services:
  odoo:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile

    network_mode: service:db  # https://www.heissenberger.at/en/blog/devcontainer-forward-ports-composer/
    volumes:
      - ../.:/workspace:cached
      - odoo-data:/data:cached
    command: sleep infinity

  db:
    image: postgres:17
    # restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: odoo
      POSTGRES_DB: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      timeout: 5s
      retries: 20



volumes:
  postgres-data:
  odoo-data:
